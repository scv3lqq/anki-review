<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Повторение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="wrap top">
  <div class="brand"><h1>Повторение</h1><span class="meta" id="meta"></span></div>
  <div class="top-right">
    <div class="tabs" id="tabs" hidden>
      <button type="button" data-view="card" aria-pressed="true">Карточка</button>
      <button type="button" data-view="list" aria-pressed="false">Список</button>
    </div>
    <button type="button" class="btn ghost slim" id="back" hidden>Колоды</button>
  </div>
</header>

<main class="wrap">
  <section id="start" hidden>
    <ol class="decks" id="decks"></ol>
    <p class="empty" id="start-empty" hidden>На сегодня повторять нечего.</p>
  </section>

  <section id="card-view" hidden>
    <div class="progress" id="progress"></div>
    <div class="pos"><span id="pos"></span><span class="chip-new" id="chip-new" hidden>new</span></div>
    <h2 class="q" id="q"></h2>
    <textarea class="answer" id="answer" placeholder="Ответ" aria-label="Ответ" spellcheck="false"></textarea>
    <div class="actions">
      <button type="button" class="btn ghost sq" id="prev" aria-label="Предыдущая карточка">←</button>
      <div class="right">
        <button type="button" class="btn ghost" id="forgot">Не помню</button>
        <button type="button" class="btn ghost" id="skip">Пропустить</button>
        <button type="button" class="btn primary" id="next">Дальше →</button>
      </div>
    </div>
    <div class="hints">
      <span class="key"><kbd>⏎</kbd>дальше</span>
      <span class="key"><kbd>⇧⏎</kbd>перенос строки</span>
      <span class="key"><kbd>?</kbd>не помню</span>
      <span class="end"><span class="key"><kbd>⌘⏎</kbd>отправить сейчас · </span><span id="count"></span></span>
    </div>
  </section>

  <section id="list-view" hidden>
    <ol class="rows" id="rows"></ol>
  </section>

  <section id="checking" class="center" hidden>
    <div class="pulse" id="pulse"><i></i></div>
    <h2 id="check-title">Claude сверяет ответы</h2>
    <p id="check-sub"></p>
    <button type="button" class="btn primary" id="retry" hidden>Проверить ещё раз</button>
  </section>

  <section id="results" class="results" hidden>
    <div class="label" id="res-label"></div>
    <div class="counters" id="counters"></div>
    <div class="strip" id="strip"></div>
    <div class="weak" id="weak"><div class="label">Слабые места</div><div class="chips" id="chips"></div></div>
    <ol class="res-rows" id="res-rows"></ol>
  </section>

  <section id="error" class="center" hidden>
    <h2>Сервер не отвечает</h2>
    <p>Обнови страницу чуть позже. Введённые ответы сохранились в этом браузере.</p>
  </section>
</main>

<div class="bar" id="start-bar" hidden>
  <div class="wrap">
    <span class="txt" id="start-hint"></span>
    <div class="take">
      <input type="number" id="start-count" inputmode="numeric" min="1" step="1" aria-label="Сколько карточек взять" title="Сколько карточек взять">
      <button type="button" class="btn primary" id="start-go">Начать</button>
    </div>
  </div>
</div>

<div class="bar" id="list-bar" hidden>
  <div class="wrap">
    <span class="count" id="list-count"></span>
    <div class="mini"><i id="list-mini"></i></div>
    <button type="button" class="btn primary" id="list-submit">На проверку</button>
  </div>
</div>

<div class="bar" id="res-bar" hidden>
  <div class="wrap" id="res-wrap">
    <span class="txt" id="res-hint"></span>
    <button type="button" class="btn primary" id="write">Записать в Anki</button>
    <span class="done" id="done" hidden><i></i>Записано в Anki</span>
    <div class="take" id="take" hidden>
      <input type="number" id="take-count" inputmode="numeric" min="1" step="1" aria-label="Сколько карточек взять" title="Сколько карточек взять">
      <button type="button" class="btn primary" id="more">Ещё карточки</button>
    </div>
    <button type="button" class="btn primary" id="to-decks" hidden>К колодам</button>
  </div>
</div>
</body>
</html>
